[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carla-gym"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "SpaciousCoder78", email = "88923986+spaciouskarter78@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/SpaciousCoder78/carla-gym#readme"
Issues = "https://github.com/SpaciousCoder78/carla-gym/issues"
Source = "https://github.com/SpaciousCoder78/carla-gym"

[tool.hatch.version]
path = "src/carla_gym/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/carla_gym tests}"

[tool.coverage.run]
source_pkgs = ["carla_gym", "tests"]
branch = true
parallel = true
omit = [
  "src/carla_gym/__about__.py",
]

[tool.coverage.paths]
carla_gym = ["src/carla_gym", "*/carla-gym/src/carla_gym"]
tests = ["tests", "*/carla-gym/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
