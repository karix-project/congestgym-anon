[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-gym"
version = "0.2.0"
description = "Modular network-simulation RL environment for QoS-aware resource allocation"
requires-python = ">=3.10"
dependencies = ["gymnasium>=0.29", "networkx>=3.0", "numpy>=1.24",
                "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["carla_gym*"]
